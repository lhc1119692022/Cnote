name: Release Cnote macOS portable

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    name: macOS ${{ matrix.arch }} portable ZIP
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: macos-15-intel
            script: package:mac:x64
          - arch: arm64
            runner: macos-14
            script: package:mac:arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            desktop/package-lock.json
      - name: Install Web dependencies
        working-directory: web
        run: npm ci
      - name: Install Desktop dependencies
        working-directory: desktop
        run: npm ci
      - name: Build portable macOS ZIP
        working-directory: desktop
        run: npm run ${{ matrix.script }}
      - name: Verify ad-hoc signature
        shell: bash
        run: |
          app="$(find desktop/release -type d -name 'Cnote.app' -print -quit)"
          test -n "$app"
          codesign --verify --deep --strict "$app"
          codesign --display --verbose=2 "$app" 2>&1 | tee desktop/release/codesign-${{ matrix.arch }}.txt
      - name: Check version
        shell: bash
        run: |
          version="$(node -p "require('./desktop/package.json').version")"
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "Tag and desktop version differ"
            exit 1
          fi
      - name: Create or wait for GitHub Release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          for attempt in {1..30}; do
            if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then exit 0; fi
            if gh release create "$GITHUB_REF_NAME" --title "Cnote $(node -p "require('./desktop/package.json').version")" --notes-file docs/portable-release.md >/dev/null 2>&1; then exit 0; fi
            sleep 10
          done
          echo "GitHub Release was not available"
          exit 1
      - name: Upload portable ZIP and checksum
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          version="$(node -p "require('./desktop/package.json').version")"
          zip="$(find desktop/release -maxdepth 1 -type f -name '*.zip' -print -quit)"
          test -n "$zip"
          checksum="desktop/release/Cnote-$version-mac-${{ matrix.arch }}-SHA256SUMS.txt"
          shasum -a 256 "$zip" | sed "s#desktop/release/##" > "$checksum"
          gh release upload "$GITHUB_REF_NAME" "$zip" "$checksum" --clobber
      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: cnote-macos-${{ matrix.arch }}
          path: |
            desktop/release/*.zip
            desktop/release/*SHA256SUMS.txt
          if-no-files-found: error
